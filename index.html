<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Equity Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <container class="equity-container">
	<header class="header-row">
	    <label id="hand-label">Hand</label>
	    <label id="equity-label">Equity</label>
	</header>

	<main-layout>
	    <player-list></player-list>

	    <side-panel class="controls-sidebar">
		<board class="board-group">
		    <label>Board</label>
		    <input type="text" class="input-board" readonly>
		</board>
		<controls>
		    <button class="btn-evaluate">Evaluate</button>
		    <button class="btn-clear">Clear</button>
		</controls>
	    </side-panel>
	</main-layout>
    </container> 

</body>
</html>

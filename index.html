<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Equity Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="game.js" defer></script>
    <script src="ui-controller.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>

<container>
    <header>
        <label class="label-hand">Hand</label>
        <label class="label-equity">Equity</label>
    </header>

    <main-layout>
        <player-list></player-list>

        <side-panel>
            <board-group>
                <label>Board</label>
                <input type="text" id="board-input" class="input-board" placeholder="JcTh2s">
            </board-group>
            
            <controls>
                <button id="btn-evaluate">Evaluate</button>
                <button id="btn-clear">Clear All</button>
            </controls>
        </side-panel>
    </main-layout>
</container>
</body>
</html>
